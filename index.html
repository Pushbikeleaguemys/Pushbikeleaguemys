<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#12151a;--muted:#6a7380;--line:#e4e7ec;--lime:#b7e000;--lime-ink:#1a2300;--hot:#e8402a;--gold:#e0a800;--silver:#8a949e;--bronze:#b9733a;--chip:#eceff3;--hero:#0b0d10;--hero-ink:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0d10;--card:#171a1f;--ink:#f1f3f6;--muted:#97a0ac;--line:#262b32;--chip:#232830}}
:root[data-theme="dark"]{--bg:#0b0d10;--card:#171a1f;--ink:#f1f3f6;--muted:#97a0ac;--line:#262b32;--chip:#232830}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.3;padding-bottom:84px}
header{background:var(--hero);color:var(--hero-ink);padding:14px 16px 16px}
.wrap{max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--lime);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font-size:19px;letter-spacing:.3px}.brand h1 span{color:var(--lime)}
.brand p{margin:2px 0 0;font-size:12px;opacity:.7}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--lime)}.stat span{font-size:11px;opacity:.75}
main{max-width:720px;margin:0 auto;padding:12px}
.seg{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg::-webkit-scrollbar{display:none}
.pill{flex:none;border:0;background:var(--chip);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px}
.pill.on{background:var(--lime);color:var(--lime-ink)}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.pole{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.pole .tag{display:inline-block;background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:12px;letter-spacing:.8px;padding:4px 10px;border-radius:999px}
.pole h2{margin:10px 0 2px;font-size:26px}
.pole .sub{opacity:.75;font-size:13px}
.pole .pts{position:absolute;right:16px;top:14px;text-align:right}
.pole .pts b{font-size:40px;color:var(--lime);display:block;line-height:1}.pole .pts span{font-size:11px;opacity:.7}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;align-items:end}
.pod{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center;border-top:4px solid var(--silver)}
.pod.p1{border-color:var(--gold);padding-bottom:18px}.pod.p3{border-color:var(--bronze)}
.pod .m{font-size:24px}.pod .n{font-weight:700;font-size:14px;margin-top:2px;word-break:break-word}.pod .s{font-size:12px;color:var(--muted)}
.pod b{display:block;font-size:20px;color:var(--ink);margin-top:2px}
.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.rk{width:34px;flex:none;text-align:center;font-weight:800;font-size:17px}
.rk.r1{color:var(--gold)}.rk.r2{color:var(--silver)}.rk.r3{color:var(--bronze)}
.av{width:40px;height:40px;border-radius:50%;background:var(--lime);color:var(--lime-ink);font-weight:800;display:grid;place-items:center;flex:none;font-size:15px}
.mid{flex:1;min-width:0}.mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid span{font-size:12px;color:var(--muted)}
.pt{text-align:right;flex:none}.pt b{font-size:20px;display:block;line-height:1.1}.pt span{font-size:11px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
h3{margin:4px 2px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.feed{padding:0}.fi{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.fi:last-child{border-bottom:0}
.medal{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;flex:none;background:var(--chip)}
.medal.m1{background:var(--gold);color:#2a1f00}.medal.m2{background:var(--silver);color:#fff}.medal.m3{background:var(--bronze);color:#fff}.medal.mp{background:var(--lime);color:var(--lime-ink)}
.fi .t{font-weight:700}.fi .d{font-size:12px;color:var(--muted);margin-top:2px}
.fi .g{margin-left:auto;text-align:right;flex:none}.fi .g b{font-size:18px;color:var(--ink)}.fi .g span{display:block;font-size:11px;color:var(--muted)}
.evh{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;background:var(--chip);font-size:13px;font-weight:700}
.evh span:last-child{color:var(--muted);font-weight:600;flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--ink)}.tabs button.on svg{color:var(--hot)}
.btn{border:0;border-radius:12px;background:var(--lime);color:var(--lime-ink);font:inherit;font-weight:700;padding:12px 14px;min-height:46px;width:100%}
.btn.s{background:var(--chip);color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--chip);border-radius:12px;padding:10px 6px;text-align:center}.kv b{display:block;font-size:20px}.kv span{font-size:11px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.badge{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.back{border:0;background:none;color:var(--hot);font:inherit;font-weight:700;padding:4px 0 10px}
.bars{display:flex;align-items:flex-end;gap:5px;height:64px;margin:8px 0 2px}
.bars div{flex:1;background:var(--lime);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div i{position:absolute;top:-15px;left:0;right:0;text-align:center;font-style:normal;font-size:10px;color:var(--muted)}
.mlab{display:flex;gap:5px;font-size:10px;color:var(--muted)}.mlab span{flex:1;text-align:center}
table.sc{width:100%;border-collapse:collapse;font-size:15px}
table.sc td,table.sc th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
table.sc th{font-size:12px;color:var(--muted);text-transform:uppercase}
.note{font-size:13px;color:var(--muted)}
.note li{margin:6px 0}
.toast{z-index:100;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}

.av.pic{background:var(--lime);overflow:hidden;padding:0}
.av.pic img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
:root{--sil:#c3c8d1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sil:#343a45}}
:root[data-theme="dark"]{--sil:#343a45}
.sil{width:100%;height:100%;color:var(--sil)}
.pod .ph{display:flex;align-items:flex-end;justify-content:center;position:relative;margin-bottom:4px}
.pod .ph .cut{width:auto;max-width:100%;object-fit:contain;display:block}
.pod .ph .mb{position:absolute;right:-2px;top:-4px;font-size:22px}
.locked{position:relative;aspect-ratio:100/120;display:flex;align-items:flex-end;justify-content:center}
.pod .m{display:none}
.prow{display:flex;align-items:center;gap:12px;margin-top:10px;padding-right:96px}
.pav{width:64px;height:64px;border-radius:50%;background:var(--lime);overflow:hidden;flex:none}
.pav img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.pav.lockd{background:#1b1f26;padding:8px 8px 0;display:flex;align-items:flex-end}.pav.lockd .sil{color:#3c4350}
.prow h2{margin:0 0 2px!important}

.adminbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:-2px 0 10px;min-height:28px}
.abtn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.abadge{background:var(--lime);color:var(--lime-ink);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;letter-spacing:.4px}
.ebtn{border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;font-weight:700;margin-left:6px;flex:none;align-self:center;cursor:pointer}
.admrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .btn{margin-top:8px}
.card p.note{margin:4px 0 6px}
.modal{position:fixed;inset:0;z-index:200;display:none}
.modal.on{display:block}
.mback{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;overflow:auto}
.mcard{background:var(--card);color:var(--ink);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow:auto}
@media(min-width:600px){.mback{align-items:center}.mcard{border-radius:20px}}
.mh{margin:0 0 6px;font-size:20px}
.fl{display:block;margin:10px 0 0}
.fl span{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.fl input,.fl select,.fl textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fl input[readonly]{opacity:.6}
.fl textarea{resize:vertical;min-height:84px;line-height:1.4}
.mkdesc{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mkdesc span{display:block;color:var(--muted);margin-bottom:3px}
.mkdesc div{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}
.brow{display:flex;gap:8px;margin-top:14px}.brow .btn{flex:1}
.btn.d{background:var(--hot);color:#fff}
.phrow{display:flex;gap:14px;align-items:center;margin:10px 0 0}
.phbox{width:80px;height:104px;border-radius:12px;background:var(--chip);flex:none;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.phbox img{width:100%;height:100%;object-fit:contain}
.imp{padding-left:18px;margin:8px 0 0}

.tabs button{white-space:nowrap}
@media(max-width:400px){.tabs button{font-size:10px}}
.mkhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 2px 12px}
.mkgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mk{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer}
.mkimg{aspect-ratio:1;background:var(--chip);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.mkimg img{width:100%;height:100%;object-fit:cover;display:block}
.mkb{padding:9px 10px 11px}.mkp{font-size:17px}
.mkt{font-weight:600;font-size:14px;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkbadge{display:inline-block;margin-top:5px;background:var(--chip);border-radius:999px;font-size:10px;padding:2px 8px;font-weight:700;color:var(--muted)}
.mkph{display:flex;gap:8px}
.mkth,.mkadd{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--chip);flex:none}
.mkth img{width:100%;height:100%;object-fit:cover;display:block}
.mkx{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1;padding:0}
.mkadd{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;color:var(--muted);cursor:pointer;border:2px dashed var(--line);background:transparent}
.mkadd span{font-size:11px;font-weight:600}
.mkmain{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--chip);display:block}
.mkthumbs{display:flex;gap:8px;margin-top:8px}
.mkthumbs button{border:0;padding:0;width:56px;height:56px;border-radius:10px;overflow:hidden;background:none}
.mkthumbs img{width:100%;height:100%;object-fit:cover;display:block}
.mkprice{font-size:26px;font-weight:800;margin:12px 0 2px}
.mkrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mkrow span:first-child{color:var(--muted)}
a.btn{display:block;text-align:center;text-decoration:none;margin-top:12px}

.pav.zoom{cursor:zoom-in}
.zoomimg{display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:14px;background:#000}
.evcard{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
.evcard:last-child{border-bottom:0}
.evcard .evn{font-weight:700;font-size:15px;word-break:break-word}
.evcard .evl{color:var(--muted);font-size:13px;margin-top:2px}
.evdate{flex:none;text-align:center;background:var(--chip);border-radius:12px;padding:6px 10px;min-width:56px;font-weight:800;line-height:1.1}
.evdate small{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.evdw{position:relative;flex:none;isolation:isolate}
.evflag{position:absolute;top:-11px;left:-11px;font-size:26px;line-height:1;transform:rotate(-18deg);z-index:0;pointer-events:none}
.evdate{position:relative;z-index:1}
.evcard.past{opacity:.65}
.evsub{margin:12px 2px 6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.evhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
details.lg{margin:10px 0}details.lg>summary{cursor:pointer;font-weight:700;padding:12px 14px;background:var(--card);border-radius:14px;list-style:none}
details.lg[open]>summary{border-radius:14px 14px 0 0}
</style>

<script>

var RIDERS,RES,byId,GROUPS;
function syncData(){
  RIDERS=D.riders;RES=D.results;byId={};RIDERS.forEach(function(r){byId[r.id]=r;});
  GROUPS=[];RES.forEach(function(x){if(x.grp!=null&&GROUPS.indexOf(x.grp)<0)GROUPS.push(x.grp);});GROUPS.sort(function(a,b){return a-b;});
}
var PTS={1:10,2:8,3:6,4:4,5:2};            // 6th to 12th = 1 point
var NOV={1:6,2:5,3:4,4:3,5:2,6:1};            // novice level: 1st to 6th only
function pts(p,lvl){if(p==null)return 0;if(lvl==="novice")return NOV[p]||0;if(PTS[p])return PTS[p];return(p>=6&&p<=12)?1:0;}

function score(x){return pts(x.place,x.lvl)+(x.ovs?BONUS:0);}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ord(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function avatar(r){return r.pic?'<div class="av pic"><img src="'+r.pic+'" alt=""></div>':'<div class="av">'+esc(ini(r.nick))+'</div>';}
function sil(){return '<svg class="sil" viewBox="0 0 100 120" aria-hidden="true"><g fill="currentColor"><path d="M27 42A23 23 0 0 1 73 42V47H27Z"/><ellipse cx="50" cy="55" rx="15" ry="12"/><rect x="43" y="64" width="14" height="14" rx="4"/><path d="M8 120C8 94 28 80 50 80C72 80 92 94 92 120Z"/></g></svg>';}
function photo(r,h){return r.pic?'<img class="cut" style="height:'+h+'px" src="'+r.pic+'" alt="">':'<div class="locked" style="height:'+h+'px">'+sil()+'</div>';}
function ini(n){var p=String(n).trim().split(/\s+/);return((p[0]||"")[0]||"")+((p[1]||"")[0]||"");}
function fmtDate(d){if(!d)return"Date not recorded";var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],p=d.split("-");return parseInt(p[2],10)+" "+m[parseInt(p[1],10)-1]+" "+p[0];}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove("show");},2200);}

syncData();

/* ---- standings ---- */
function standings(group){
  var m={};
  RIDERS.forEach(function(r){m[r.id]={r:r,pts:0,bonus:0,races:0,w:0,p2:0,p3:0,pod:0,top10:0,best:null};});
  RES.forEach(function(x){
    if(group!=null&&x.grp!==group)return;
    var s=m[x.rid];if(!s)return;
    s.races++;s.pts+=score(x);if(x.ovs)s.bonus+=BONUS;
    if(x.place===1)s.w++;if(x.place===2)s.p2++;if(x.place===3)s.p3++;
    if(x.place&&x.place<=3)s.pod++;if(x.place&&x.place<=10)s.top10++;
    if(x.place&&(s.best==null||x.place<s.best))s.best=x.place;
  });
  var list=Object.keys(m).map(function(k){return m[k];});
  if(group!=null)list=list.filter(function(s){return s.races>0;});
  list.sort(function(a,b){return b.pts-a.pts||b.w-a.w||b.pod-a.pod||a.races-b.races||a.r.nick.localeCompare(b.r.nick);});
  var rank=0,prev=null;
  list.forEach(function(s,i){
    if(s.races===0){s.rank=null;return;}
    var key=[s.pts,s.w,s.pod,s.races].join("|");
    if(key!==prev){rank=i+1;prev=key;}
    s.rank=rank;
  });
  return list;
}
function badgesFor(s){
  var b=[];
  if(s.w>=1)b.push("🥇 Race winner");
  if(s.w>=5)b.push("🔥 5+ wins");
  if(s.pod>=10)b.push("🏆 10+ podiums");
  if(s.races>=20)b.push("🚴 20+ races");
  if(s.pts>=100)b.push("⭐ 100+ points");
  if(s.races>0&&!b.length)b.push("🎯 On the grid");
  return b;
}

var tab="board",grp=null,openRider=null;

/* ---- views ---- */
function renderHeaderStats(){

  $("stats").innerHTML=[[RIDERS.length,"Riders"],[active,"Racing"],[RES.length,"Results"],[Object.keys(events).length,"Events"]].map(function(a){return '<div class="stat"><b>'+a[0]+'</b><span>'+a[1]+'</span></div>';}).join("");
}
function pill(label,on,attr){return '<button class="pill'+(on?' on':'')+'" '+attr+'>'+label+'</button>';}
function viewBoard(){

  if(ranked.length){
    var t=ranked[0];
    h+='<div class="pole"><span class="tag">POLE POSITION</span><div class="pts"><b>'+t.pts+'</b><span>POINTS</span></div><div class="prow">'+(t.r.pic?'<div class="pav"><img src="'+t.r.pic+'" alt=""></div>':'<div class="pav lockd">'+sil()+'</div>')+'<div><h2>'+esc(t.r.nick)+'</h2><div class="sub">'+(grp==null?"Overall 2026":grp+" Tahun")+' · '+t.w+' wins · '+t.pod+' podiums · '+t.races+' races</div></div></div></div>';
    if(ranked.length>=3){
      var o=[ranked[1],ranked[0],ranked[2]],cl=["p2","p1","p3"],mj=["🥈","🥇","🥉"];
      h+='<div class="podium">'+o.map(function(s,i){return '<div class="pod '+cl[i]+'" data-r="'+s.r.id+'"><div class="ph">'+photo(s.r,i===1?132:104)+'<span class="mb">'+mj[i]+'</span></div><div class="n">'+esc(s.r.nick)+'</div><b>'+s.pts+'</b><div class="s">'+(s.r.pic?'pts':'pts')+'</div></div>';}).join("")+'</div>';
    }
    h+='<h3>'+(grp==null?"Overall standings":grp+" Tahun standings")+'</h3><div class="card">'+ranked.map(rowHtml).join("")+'</div>';
  }else h+='<div class="card empty">No race results in this group yet.</div>';
  if(grp==null&&unr.length)h+='<h3>No race results yet ('+unr.length+')</h3><div class="card">'+unr.map(function(s){return '<div class="row" data-r="'+s.r.id+'"><div class="rk">–</div>'+avatar(s.r)+'<div class="mid"><b>'+esc(s.r.nick)+'</b><span>Registered rider</span></div><div class="pt"><b>0</b><span>pts</span></div></div>';}).join("")+'</div>';
  h+='<button class="btn s" id="copyBoard" type="button">Copy standings for WhatsApp</button>';
  return h;
}
function rowHtml(s){
  var rc=s.rank<=3?" r"+s.rank:"";
  return '<div class="row" data-r="'+s.r.id+'"><div class="rk'+rc+'">'+s.rank+'</div>'+avatar(s.r)+'<div class="mid"><b>'+esc(s.r.nick)+'</b><span>'+s.races+' races · '+s.w+' wins · '+s.pod+' podiums'+(s.r.bib?' · #'+s.r.bib:'')+'</span></div><div class="pt"><b>'+s.pts+'</b><span>pts</span></div></div>';
}
function lvlTag(x){if(!x.tag)return"";var w=x.tag.split(" ")[0];return w.charAt(0)+w.slice(1).toLowerCase();}
function medalCls(p){return p===1?"m1":p===2?"m2":p===3?"m3":(p&&p<=12)?"mp":"";}
function resItem(x,showRider){

  if(typeof v==="object"&&v.d!=null)return new Date(Math.round((v.d-25569)*864e5)).toISOString().slice(0,10);

  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return m[1]+"-"+pad2(+m[2])+"-"+pad2(+m[3]);

/* Shared marketplace store: Firebase Realtime Database over plain REST (no SDK).
   Paste your database URL below, e.g. "https://your-project-default-rtdb.asia-southeast1.firebasedatabase.app" */
var MK_DB="";
var LSM="cpb_market_mine_v1",LSC="cpb_market_cache_v1",LSO="cpb_market_own_v1";
var MINE=[],SHARED=[],OWN=[],mkLast=0,mkErr=false,mkBusy=false;
try{MINE=JSON.parse(localStorage.getItem(LSM)||"[]");if(!Array.isArray(MINE))MINE=[];}catch(_){MINE=[];}
try{SHARED=JSON.parse(localStorage.getItem(LSC)||"[]");if(!Array.isArray(SHARED))SHARED=[];}catch(_){SHARED=[];}
try{OWN=JSON.parse(localStorage.getItem(LSO)||"[]");if(!Array.isArray(OWN))OWN=[];}catch(_){OWN=[];}
function mkReady(){return/^https:\/\//.test(MK_DB);}
function mkUrl(id){return MK_DB.replace(/\/+$/,"")+"/market"+(id?"/"+encodeURIComponent(id):"")+".json";}
function mkCache(){try{localStorage.setItem(LSC,JSON.stringify(SHARED));}catch(_){}}
function mkOwnSave(){try{localStorage.setItem(LSO,JSON.stringify(OWN));}catch(_){}}
function mkIsOwn(id){return OWN.indexOf(id)>=0;}
function mkAll(){return SHARED.slice().sort(function(a,b){return(b.ts||0)-(a.ts||0);});}
function mkFind(id){for(var i=0;i<SHARED.length;i++)if(SHARED[i].id===id)return SHARED[i];return null;}
function mkCan(x){return ADMIN||mkIsOwn(x.id);}
function mkReq(method,id,body){
  var o={method:method};if(body!==undefined){o.body=JSON.stringify(body);o.headers={"Content-Type":"application/json"};}
  return fetch(mkUrl(id),o).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json();});
}
function mkFetch(force){
  if(!mkReady()||mkBusy)return Promise.resolve();
  if(!force&&Date.now()-mkLast<8000)return Promise.resolve();
  mkBusy=true;mkLast=Date.now();
  return mkReq("GET").then(function(o){
    var list=o?Object.keys(o).filter(function(k){return o[k]&&typeof o[k]==="object";}).map(function(k){return Object.assign({},o[k],{id:k});}):[];
    var changed=JSON.stringify(list)!==JSON.stringify(SHARED);mkErr=false;SHARED=list;mkCache();
    return mkMigrate().then(function(){if((changed||mkErr)&&tab==="market")render();});
  }).catch(function(){var was=mkErr;mkErr=true;if(!was&&tab==="market")render();}).then(function(){mkBusy=false;});
}
/* listings that were saved only on this device earlier are published automatically */
function mkMigrate(){
  if(!MINE.length)return Promise.resolve();
  var todo=MINE.slice();
  return Promise.all(todo.map(function(x){return mkReq("PUT",x.id,x).then(function(){OWN.push(x.id);SHARED.push(x);return x.id;}).catch(function(){return null;});})).then(function(done){
    MINE=MINE.filter(function(x){return done.indexOf(x.id)<0;});
    try{localStorage.setItem(LSM,JSON.stringify(MINE));}catch(_){}
    mkOwnSave();mkCache();
  });
}

  h2.insertAdjacentHTML("afterend",'<label class="fl"><span>Choose an existing rider to edit or update their photo</span><select id="f_pick"><option value="">+ New rider</option>'
    +RIDERS.slice().sort(function(a,b){return a.nick.localeCompare(b.nick);}).map(function(r){return'<option value="'+esc(r.id)+'"'+(r.id===id?" selected":"")+'>'+esc(r.nick)+(r.pic?"":" (no photo)")+'</option>';}).join("")+'</select></label>');
};
var viewAdmin0=viewAdmin;
viewAdmin=function(){
  var h=viewAdmin0(),opts=RIDERS.slice().sort(function(a,b){return a.nick.localeCompare(b.nick);}).map(function(r){return'<option value="'+esc(r.id)+'"'+(r.id===lastQp?" selected":"")+'>'+esc(r.nick)+(r.pic?"":" (no photo)")+'</option>';}).join("");
  var card='<div class="card"><b>Update a rider photo</b><p class="note">Pick an existing rider, then choose a photo. It is saved straight away.</p><label class="fl"><span>Rider</span><select id="qp_rider">'+opts+'</select></label><label class="btn" style="display:block;text-align:center">Choose photo<input type="file" id="qpf" accept="image/*" hidden></label></div>';
  return h.replace('<div class="card"><b>Add or edit</b>',card+'<div class="card"><b>Add or edit</b>');
};
document.addEventListener("change",function(e){
  var t=e.target,f=t.files&&t.files[0];
  if(t.id==="mk_pf"&&f){
    var room=3-mkPics.length,fs=Array.from(t.files).slice(0,room);
    if(t.files.length>room)toast("Maximum 3 photos");
    Promise.all(fs.map(mkPhoto)).then(function(us){us.forEach(function(u){if(mkPics.length<3)mkPics.push(u);});mkStrip();}).catch(function(){toast("Could not read that image");});
  }else if(t.id==="qpf"&&ADMIN&&f){
    var id=$("qp_rider").value;lastQp=id;
    blobToPic(f).then(function(u){byId[id].pic=u;if(save()){render();toast(byId[id].nick+" photo updated");}}).catch(function(){toast("Could not read that image");});
    t.value="";
  }else if(t.id==="f_pick"&&ADMIN){riderForm(t.value||null);}
});

window.__cpb={derive:derive,parseWorkbook:parseWorkbook,buildImport:buildImport,sha256:sha256,get D(){return D;}};

renderHeaderStats();render();
})();
